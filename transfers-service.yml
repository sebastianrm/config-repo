# ============================================================================
# Configuración específica de transfers-service
# ============================================================================
server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful

spring:
  application:
    name: transfers-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://mongo:27017/yanki_transfers}
      database: yanki_transfers
      auto-index-creation: true
  kafka:
    consumer:
      group-id: ${KAFKA_GROUP_ID:transfers-service}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
